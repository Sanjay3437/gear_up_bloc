name: gear_up_bloc
description: "Flutter Bloc + Clean Architecture base by Sanjay"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
#Package name :
#  Android - com.example.bloc_advanced
#  IOS - com.example.bloc2026
#Flutter sdk - 3.44.9

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  get: ^4.7.3
  go_router: ^18.0.2
  flutter_svg: ^2.3.0
  equatable: ^2.1.0
  get_it: ^9.3.0
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  flutter_pretty_dio_logger: ^3.0.0
  connectivity_plus: ^7.3.2
  cached_network_image: ^4.0.3
  toastification: ^3.2.0
  flutter_secure_storage: ^11.2.0
  jwt_decoder: ^2.0.1
  share_plus: ^13.3.1
  skeletonizer: ^3.0.0
  permission_handler: ^13.0.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  rename_app: ^1.6.6
  # dart run rename_app:main all="appName"

flutter:

  uses-material-design: true
  assets:
    - assets/language/
    - assets/images/
    - assets/icons/
    - assets/gif/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Light.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  # dart run flutter_launcher_icons